<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff8e1, #e8f5e9);
  text-align: center;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 25px 15px;
}

h1 {
  margin-bottom: 5px;
  color: #2e7d32;
}

.subtitle {
  margin-top: 0;
  color: #666;
}

button {
  width: 100%;
  max-width: 420px;
  padding: 16px;
  margin: 8px auto;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: #4caf50;
  color: white;
}

button:active {
  transform: scale(0.98);
}

#cameraArea {
  display: none;
  margin-top: 15px;
}

#cameraContainer {
  width: 100%;
  max-width: 500px;
  margin: auto;
  border-radius: 18px;
  overflow: hidden;
  background: #000;
}

#cameraContainer canvas,
#cameraContainer video {
  width: 100% !important;
  height: auto !important;
  display: block;
}

#captureBtn {
  background: #e53935;
  display: none;
}

#retakeBtn {
  background: #ff9800;
  display: none;
}

#uploadArea {
  display: none;
  margin-top: 15px;
}

#preview {
  max-width: 100%;
  max-height: 500px;
  border-radius: 18px;
  display: none;
  margin: 15px auto;
}

#result {
  margin-top: 20px;
  display: none;
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

.resultName {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 8px;
}

.resultPercent {
  font-size: 24px;
  color: #2e7d32;
  font-weight: bold;
}

.bar {
  height: 14px;
  background: #eee;
  border-radius: 20px;
  margin: 8px 0 15px;
  overflow: hidden;
}

.barFill {
  height: 100%;
  background: #4caf50;
  border-radius: 20px;
  width: 0%;
  transition: width .4s;
}

.fileLabel {
  display: block;
  width: 100%;
  max-width: 420px;
  margin: 8px auto;
  padding: 16px;
  background: #2196f3;
  color: white;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

input[type="file"] {
  display: none;
}

.status {
  margin: 15px;
  color: #666;
}
</style>
</head>

<body>

<div class="container">

  <h1>🍎 Fruit AI</h1>
  <p class="subtitle">Nhận diện trái cây bằng trí tuệ nhân tạo</p>

  <!-- 2 CHỨC NĂNG CHÍNH -->
  <button onclick="startCamera()">
    📷 Nhận diện bằng Camera
  </button>

  <label class="fileLabel">
    🖼️ Tải ảnh lên
    <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
  </label>

  <!-- CAMERA -->
  <div id="cameraArea">

    <div id="cameraContainer"></div>

    <button id="captureBtn" onclick="capturePhoto()">
      📸 CHỤP ẢNH
    </button>

    <button id="retakeBtn" onclick="retakePhoto()">
      🔄 CHỤP LẠI
    </button>

  </div>

  <!-- ẢNH UPLOAD -->
  <img id="preview">

  <div class="status" id="status">
    Đang tải AI...
  </div>

  <!-- KẾT QUẢ -->
  <div id="result">

    <div class="resultName" id="resultName"></div>

    <div class="resultPercent" id="resultPercent"></div>

    <div id="bars"></div>

  </div>

</div>

<script>

const URL = "https://teachablemachine.withgoogle.com/models/6csAwjG54/";

let model;
let webcam;
let maxPredictions;
let cameraRunning = false;
let captured = false;

const emoji = {
  "Chuối": "🍌",
  "Xoài": "🥭",
  "Thanh long": "🐉",
  "Cà chua": "🍅"
};

// ==========================
// TẢI MODEL
// ==========================

async function loadModel() {

  try {

    document.getElementById("status").innerText =
      "⏳ Đang tải AI...";

    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";

    model = await tmImage.load(modelURL, metadataURL);

    maxPredictions = model.getTotalClasses();

    document.getElementById("status").innerText =
      "✅ AI đã sẵn sàng!";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Không tải được AI. Hãy kiểm tra mạng.";

  }

}


// ==========================
// MỞ CAMERA SAU
// ==========================

async function startCamera() {

  if (!model) {
    alert("AI đang tải, đợi một chút rồi thử lại nhé!");
    return;
  }

  document.getElementById("cameraArea").style.display = "block";

  document.getElementById("preview").style.display = "none";

  document.getElementById("result").style.display = "none";

  document.getElementById("captureBtn").style.display = "block";

  document.getElementById("retakeBtn").style.display = "none";

  captured = false;

  try {

    // CAMERA SAU
    webcam = new tmImage.Webcam(500, 500, false);

    await webcam.setup({
      facingMode: {
        exact: "environment"
      },
      width: {
        ideal: 1280
      },
      height: {
        ideal: 1280
      }
    });

    await webcam.play();

    cameraRunning = true;

    const container =
      document.getElementById("cameraContainer");

    container.innerHTML = "";

    container.appendChild(webcam.canvas);

    document.getElementById("status").innerText =
      "📷 Camera sau đã mở — đưa trái cây vào khung rồi bấm CHỤP ẢNH.";

    cameraLoop();

  } catch (error) {

    console.error(error);

    // Nếu exact environment không được,
    // thử lại camera sau theo cách nhẹ hơn

    try {

      webcam = new tmImage.Webcam(500, 500, false);

      await webcam.setup({
        facingMode: {
          ideal: "environment"
        }
      });

      await webcam.play();

      cameraRunning = true;

      const container =
        document.getElementById("cameraContainer");

      container.innerHTML = "";

      container.appendChild(webcam.canvas);

      document.getElementById("status").innerText =
        "📷 Camera đã mở — đưa trái cây vào khung rồi bấm CHỤP ẢNH.";

      cameraLoop();

    } catch (error2) {

      console.error(error2);

      alert(
        "Không mở được camera. Hãy cho phép trình duyệt sử dụng camera nhé!"
      );

    }

  }

}


// ==========================
// CHỈ HIỂN THỊ CAMERA
// KHÔNG NHẬN DIỆN LIÊN TỤC
// ==========================

function cameraLoop() {

  if (!cameraRunning || captured) return;

  webcam.update();

  requestAnimationFrame(cameraLoop);

}


// ==========================
// CHỤP ẢNH
// ==========================

async function capturePhoto() {

  if (!webcam || captured) return;

  captured = true;

  cameraRunning = false;

  // Lưu đúng frame hiện tại
  const canvas = document.createElement("canvas");

  canvas.width = webcam.canvas.width;
  canvas.height = webcam.canvas.height;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    webcam.canvas,
    0,
    0,
    canvas.width,
    canvas.height
  );

  // Hiển thị ảnh đã chụp
  const container =
    document.getElementById("cameraContainer");

  container.innerHTML = "";

  container.appendChild(canvas);

  document.getElementById("captureBtn").style.display = "none";

  document.getElementById("retakeBtn").style.display = "block";

  document.getElementById("status").innerText =
    "⏳ Đang nhận diện ảnh vừa chụp...";

  // CHỈ NHẬN DIỆN 1 LẦN
  await predict(canvas);

}


// ==========================
// CHỤP LẠI
// ==========================

async function retakePhoto() {

  if (webcam) {

    try {
      webcam.stop();
    } catch (e) {}

  }

  document.getElementById("cameraContainer").innerHTML = "";

  document.getElementById("result").style.display = "none";

  document.getElementById("retakeBtn").style.display = "none";

  document.getElementById("captureBtn").style.display = "block";

  captured = false;

  cameraRunning = false;

  // Mở lại camera
  await startCamera();

}


// ==========================
// TẢI ẢNH
// ==========================

function handleImage(event) {

  const file = event.target.files[0];

  if (!file) return;

  if (!model) {

    alert("AI đang tải, đợi một chút nhé!");

    return;

  }

  // Tắt camera nếu đang mở
  if (webcam) {

    try {
      webcam.stop();
    } catch (e) {}

  }

  cameraRunning = false;
  captured = false;

  document.getElementById("cameraArea").style.display = "none";

  document.getElementById("result").style.display = "none";

  const reader = new FileReader();

  reader.onload = function(e) {

    const img = new Image();

    img.onload = async function() {

      const preview =
        document.getElementById("preview");

      preview.src = e.target.result;

      preview.style.display = "block";

      document.getElementById("status").innerText =
        "⏳ Đang nhận diện ảnh...";

      await predict(img);

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(file);

}


// ==========================
// NHẬN DIỆN
// ==========================

async function predict(input) {

  try {

    const prediction =
      await model.predict(input, false);

    let bestIndex = 0;

    for (let i = 1; i < prediction.length; i++) {

      if (
        prediction[i].probability >
        prediction[bestIndex].probability
      ) {

        bestIndex = i;

      }

    }

    const best =
      prediction[bestIndex];

    const name =
      best.className;

    const percent =
      (best.probability * 100).toFixed(1);

    document.getElementById("resultName").innerText =
      (emoji[name] || "🍎") + " " + name;

    document.getElementById("resultPercent").innerText =
      percent + "%";

    // Thanh tỷ lệ
    const bars =
      document.getElementById("bars");

    bars.innerHTML = "";

    prediction.forEach(p => {

      const percentValue =
        (p.probability * 100).toFixed(1);

      const row =
        document.createElement("div");

      row.innerHTML = `
        <div style="text-align:left;font-weight:bold;">
          ${emoji[p.className] || "🍎"} ${p.className}
          — ${percentValue}%
        </div>

        <div class="bar">
          <div class="barFill"
               style="width:${percentValue}%">
          </div>
        </div>
      `;

      bars.appendChild(row);

    });

    document.getElementById("result").style.display =
      "block";

    document.getElementById("status").innerText =
      "✅ Đã chốt kết quả!";

  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ Không thể nhận diện ảnh.";

  }

}


// ==========================
// CHẠY
// ==========================

loadModel();

</script>

</body>
</html>
